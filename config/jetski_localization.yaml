# Localization of the JetLocalization simulation configuration with rpp_localization.
/**:
  ros__parameters:
    script: rpp_localization::localization
    configuration: ekf
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: false
    publish_tf: true
    print_diagnostics: false
    world_frame: odom
    odom_frame: odom
    base_link_frame: base_link

    # Each config lists x, y, z, roll, pitch, yaw, their rates, and
    # the linear accelerations.
    imu0: imu/data
    imu0_config: [false, false, false,
                  true, true, true,
                  false, false, false,
                  true, true, true,
                  true, true, true]
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 20

    twist0: dvl/data
    twist0_config: [false, false, false,
                    false, false, false,
                    true, true, true,
                    false, false, false,
                    false, false, false]
    twist0_queue_size: 10

    pose0: position
    pose0_config: [true, true, true,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    pose0_queue_size: 10

    initial_estimate_covariance:
      [1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2,
       1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2,
       1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2, 1.0e-2]
